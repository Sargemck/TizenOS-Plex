name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Install test browser
        run: npx playwright install chromium
      - name: Install independent QR decoder
        run: python -m pip install opencv-python-headless==5.0.0.93
      - name: Syntax and release metadata
        run: npm run check
      - name: Unit and Windows installer tests
        run: npm test
      - name: Browser integration
        run: npm run test:browser
      - name: Decode rendered QR images
        run: npm run test:qr
